name: CI Pipeline

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
      - name: Run unit tests
        run: mvn test -pl spring-petclinic-customers-service -Dtest="**/unit/**"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            **/target/surefire-reports/*.xml
            **/target/allure-results/**

  integration-tests:
    name: Integration Tests (Testcontainers)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
      - name: Run integration tests
        run: mvn test -pl spring-petclinic-customers-service -Dtest="**/integration/**"
        env:
          TESTCONTAINERS_RYUK_DISABLED: true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            **/target/surefire-reports/*.xml
            **/target/allure-results/**

  contract-tests:
    name: Contract Tests (WireMock)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
      - name: Run contract tests
        run: mvn test -pl spring-petclinic-customers-service -Dtest="**/contract/**"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-test-results
          path: |
            **/target/surefire-reports/*.xml
            **/target/allure-results/**

  publish-reports:
    name: "Publish Allure + JaCoCo to GitHub Pages"
    needs: [unit-tests, integration-tests, contract-tests]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Download allure-results from unit-tests
        uses: actions/download-artifact@v4
        with:
          name: unit-test-results
          path: allure-results/unit

      - name: Download allure-results from integration-tests
        uses: actions/download-artifact@v4
        with:
          name: integration-test-results
          path: allure-results/integration

      - name: Download allure-results from contract-tests
        uses: actions/download-artifact@v4
        with:
          name: contract-test-results
          path: allure-results/contract

      - name: Run all tests with JaCoCo
        env:
          TESTCONTAINERS_RYUK_DISABLED: true
        run: |
          mvn test jacoco:report \
            -pl spring-petclinic-customers-service \
            -Dtest="**/unit/**,**/integration/**,**/contract/**" \
            -Dsurefire.forkCount=1 \
            --no-transfer-progress

      - name: Install Allure CLI
        run: |
          npm install -g allure-commandline@2.25.0

      - name: Get Allure history from gh-pages
        run: |
          git fetch origin gh-pages || true
          git checkout origin/gh-pages -- allure/history || true
          mkdir -p allure-results/history
          cp -r allure/history/* allure-results/history/ 2>/dev/null || true

      - name: Generate Allure report
        run: |
          allure generate allure-results \
            --output allure-report \
            --clean

      - name: Prepare GitHub Pages content
        run: |
          mkdir -p gh-pages-content/allure
          mkdir -p gh-pages-content/coverage

          cp -r allure-report/* gh-pages-content/allure/
          cp -r spring-petclinic-customers-service/target/site/jacoco/* \
            gh-pages-content/coverage/

      - name: Checkout current gh-pages
        run: |
          git fetch origin gh-pages || true
          git checkout origin/gh-pages -- . 2>/dev/null || true

      - name: Copy new reports preserving existing files
        run: |
          cp -r gh-pages-content/allure/* allure/ 2>/dev/null || \
            mkdir -p allure && cp -r gh-pages-content/allure/* allure/
          cp -r gh-pages-content/coverage/* coverage/ 2>/dev/null || \
            mkdir -p coverage && cp -r gh-pages-content/coverage/* coverage/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          keep_files: true
          commit_message: |
            ci: update Allure report and JaCoCo coverage
