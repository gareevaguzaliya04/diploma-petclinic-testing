name: CI Pipeline

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
      - name: Run unit tests
        run: mvn test -pl spring-petclinic-customers-service -Dtest="**/unit/**"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            **/target/surefire-reports/*.xml
            **/target/allure-results/**

  integration-tests:
    name: Integration Tests (Testcontainers)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
      - name: Run integration tests
        run: mvn test -pl spring-petclinic-customers-service -Dtest="**/integration/**"
        env:
          TESTCONTAINERS_RYUK_DISABLED: true
      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          if-no-files-found: warn
          path: |
            **/target/surefire-reports/*.xml
            **/target/allure-results/**

  contract-tests:
    name: Contract Tests (WireMock)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
      - name: Run contract tests
        run: mvn test -pl spring-petclinic-customers-service -Dtest="**/contract/**"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-test-results
          path: |
            **/target/surefire-reports/*.xml
            **/target/allure-results/**

  e2e-tests:
    name: E2E Tests (docker-compose)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Start services with docker-compose
        run: docker compose up -d config-server discovery-server customers-service visits-service vets-service api-gateway

      - name: Wait for API Gateway to be healthy
        run: |
          echo "Waiting for API Gateway..."
          for i in $(seq 1 36); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "API Gateway is UP after $((i*5)) seconds"
              exit 0
            fi
            echo "Attempt $i/36 — status=$STATUS, waiting 5s..."
            sleep 5
          done
          echo "Timed out waiting for API Gateway"
          docker compose logs
          exit 1

      - name: Run E2E tests
        run: mvn test -f petclinic-e2e-tests/pom.xml -Dbase.url=http://localhost:8080

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          if-no-files-found: warn
          path: |
            petclinic-e2e-tests/target/surefire-reports/*.xml
            petclinic-e2e-tests/target/allure-results/**

      - name: Stop services
        if: always()
        run: docker compose down

  gatling-tests:
    name: Gatling Load Tests
    runs-on: ubuntu-latest
    needs: e2e-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Start services with docker-compose
        run: docker compose up -d config-server discovery-server customers-service visits-service vets-service api-gateway

      - name: Wait for API Gateway to be healthy
        run: |
          for i in $(seq 1 36); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || echo "000")
            if [ "$STATUS" = "200" ]; then echo "UP"; exit 0; fi
            sleep 5
          done
          docker compose logs; exit 1

      - name: Run Gatling simulation
        run: mvn gatling:test -f performance-tests/pom.xml -Dbase.url=http://localhost:8080
        continue-on-error: true

      - name: Upload Gatling results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatling-results
          if-no-files-found: warn
          path: performance-tests/target/gatling/**/simulation.log

      - name: Stop services
        if: always()
        run: docker compose down

  publish-reports:
    name: "Publish Allure + JaCoCo to GitHub Pages"
    needs: [unit-tests, integration-tests, contract-tests, e2e-tests, gatling-tests]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Download allure-results from unit-tests
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: unit-test-results
          path: allure-results/unit

      - name: Download allure-results from integration-tests
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: integration-test-results
          path: allure-results/integration

      - name: Download allure-results from contract-tests
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: contract-test-results
          path: allure-results/contract

      - name: Download allure-results from e2e-tests
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: e2e-test-results
          path: allure-results/e2e

      - name: Download Gatling simulation.log
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: gatling-results
          path: gatling-results

      - name: Run all tests with JaCoCo
        env:
          TESTCONTAINERS_RYUK_DISABLED: true
        run: |
          mvn test jacoco:report \
            -pl spring-petclinic-customers-service \
            -Dtest="**/unit/**,**/integration/**,**/contract/**" \
            -Dsurefire.forkCount=1 \
            --no-transfer-progress

      - name: Install Allure CLI
        run: npm install -g allure-commandline@2.25.0

      - name: Restore Allure history from gh-pages
        run: |
          git fetch origin gh-pages 2>/dev/null || true
          mkdir -p allure-results/history
          git show origin/gh-pages:allure/history/history.json \
            > allure-results/history/history.json 2>/dev/null || true
          git show origin/gh-pages:allure/history/history-trend.json \
            > allure-results/history/history-trend.json 2>/dev/null || true

      - name: Generate Allure report
        run: |
          allure generate allure-results \
            --output site/allure \
            --clean

      - name: Copy JaCoCo report
        run: |
          mkdir -p site/coverage
          if [ -d spring-petclinic-customers-service/target/site/jacoco ]; then
            cp -r spring-petclinic-customers-service/target/site/jacoco/. site/coverage/
          else
            echo "<html><body><h2>JaCoCo report not generated</h2></body></html>" \
              > site/coverage/index.html
          fi

      - name: Generate dynamic dashboard
        run: python3 generate-dashboard.py
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME:   ${{ github.ref_name }}

      - name: Update docs/index.html in source branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp site/index.html docs/index.html
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "docs/index.html unchanged, skipping commit"
          else
            git commit -m "ci: update dashboard [skip ci]"
            git push origin ${{ github.ref_name }}
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          publish_branch: gh-pages
          keep_files: false
          commit_message: "ci: update Allure report and JaCoCo coverage"
